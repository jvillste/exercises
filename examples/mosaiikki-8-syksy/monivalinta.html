        let roundQuestions = [];
        let currentQuestion = null;
        let currentIndex = 0;
        let answeredCount = 0;
        let correctCount = 0;
        let wrongQuestions = [];
        let isAnswered = false;

        const questionEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const feedbackEl = document.getElementById('feedback');
        const feedbackResultEl = document.getElementById('feedback-result');
        const feedbackExplanationEl = document.getElementById('feedback-explanation');
        const correctCountEl = document.getElementById('correct-count');
        const answeredCountEl = document.getElementById('answered-count');
        const totalCountEl = document.getElementById('total-count');
        const quizArea = document.getElementById('quiz-area');
        const mainButtons = document.getElementById('main-buttons');
        const nextBtn = document.getElementById('next-btn');
        const completionMessage = document.getElementById('completion-message');
        const completionHeading = document.getElementById('completion-heading');
        const completionText = document.getElementById('completion-text');
        const retryWrongBtn = document.getElementById('retry-wrong-btn');
        const restartBtn = document.getElementById('restart-btn');
        const progressBar = document.querySelector('.progress');

        function shuffle(items) {
            const shuffled = [...items];
            for (let index = shuffled.length - 1; index > 0; index--) {
                const swapIndex = Math.floor(Math.random() * (index + 1));
                [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
            }
            return shuffled;
        }

        function startRound(sourceQuestions) {
            roundQuestions = sourceQuestions.map(function (source) {
                return {
                    source: source,
                    question: source.question,
                    explanation: source.explanation || '',
                    options: shuffle(source.options.map(function (text, index) {
                        return { text: text, isCorrect: index === source.correct };
                    }))
                };
            });

            currentIndex = 0;
            answeredCount = 0;
            correctCount = 0;
            wrongQuestions = [];
            isAnswered = false;

            completionMessage.style.display = 'none';
            quizArea.style.display = 'block';
            progressBar.style.display = 'block';
            mainButtons.style.display = 'flex';

            renderQuestion();
        }

        function renderQuestion() {
            currentQuestion = roundQuestions[currentIndex];
            isAnswered = false;

            questionEl.textContent = currentQuestion.question;
            optionsContainer.innerHTML = '';

            currentQuestion.options.forEach(function (option, index) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'option-btn';
                button.dataset.index = String(index);

                const number = document.createElement('span');
                number.className = 'option-number';
                number.textContent = String(index + 1);

                const label = document.createElement('span');
                label.className = 'option-label';
                label.textContent = option.text;

                button.append(number, label);
                button.addEventListener('click', function () {
                    selectOption(index);
                });
                optionsContainer.append(button);
            });

            feedbackEl.style.display = 'none';
            feedbackEl.classList.remove('correct', 'wrong');
            feedbackResultEl.textContent = '';
            feedbackExplanationEl.textContent = '';
            nextBtn.style.display = 'none';
            nextBtn.textContent = currentIndex === roundQuestions.length - 1
                ? 'Näytä tulos (Enter)'
                : 'Seuraava (Enter)';

            updateStats();
            quizArea.classList.remove('fade-in');
            void quizArea.offsetWidth;
            quizArea.classList.add('fade-in');
        }

        function selectOption(index) {
            if (isAnswered || !currentQuestion) {
                return;
            }

            const selectedOption = currentQuestion.options[index];
            if (!selectedOption) {
                return;
            }

            isAnswered = true;
            answeredCount += 1;

            const buttons = optionsContainer.querySelectorAll('.option-btn');
            buttons.forEach(function (button, buttonIndex) {
                const option = currentQuestion.options[buttonIndex];
                button.disabled = true;

                if (option.isCorrect) {
                    button.classList.add('is-correct');
                } else if (buttonIndex === index) {
                    button.classList.add('is-wrong');
                } else {
                    button.classList.add('is-dimmed');
                }
            });

            if (selectedOption.isCorrect) {
                correctCount += 1;
                feedbackEl.classList.add('correct');
                feedbackResultEl.textContent = 'Oikein!';
            } else {
                wrongQuestions.push(currentQuestion.source);
                const correctOption = currentQuestion.options.find(function (option) {
                    return option.isCorrect;
                });
                feedbackEl.classList.add('wrong');
                feedbackResultEl.textContent = 'Väärin. Oikea vastaus: ' + (correctOption ? correctOption.text : '');
            }

            if (currentQuestion.explanation) {
                feedbackExplanationEl.textContent = currentQuestion.explanation;
            }

            feedbackEl.style.display = 'block';
            nextBtn.style.display = 'block';
            updateStats();
        }

        function updateStats() {
            correctCountEl.textContent = correctCount;
            answeredCountEl.textContent = answeredCount;
            totalCountEl.textContent = roundQuestions.length;
        }

        function nextQuestion() {
            if (!isAnswered) {
                return;
            }

            currentIndex += 1;
            if (currentIndex >= roundQuestions.length) {
                showCompletion();
            } else {
                renderQuestion();
            }
        }

        function showCompletion() {
            quizArea.style.display = 'none';
            mainButtons.style.display = 'none';
            completionMessage.style.display = 'block';

            completionHeading.textContent = 'Tulos: ' + correctCount + ' / ' + roundQuestions.length + ' oikein';

            if (wrongQuestions.length === 0) {
                completionHeading.style.color = '#27ae60';
                completionText.textContent = 'Hienoa! Vastasit kaikkiin kysymyksiin oikein.';
                retryWrongBtn.style.display = 'none';
            } else {
                completionHeading.style.color = '#1f3a5f';
                completionText.textContent = wrongQuestions.length === 1
                    ? 'Kertaa vielä 1 väärin mennyt kysymys.'
                    : 'Kertaa vielä ' + wrongQuestions.length + ' väärin mennyttä kysymystä.';
                retryWrongBtn.style.display = 'inline-block';
            }

            restartBtn.style.display = 'inline-block';
            completionMessage.classList.remove('fade-in');
            void completionMessage.offsetWidth;
            completionMessage.classList.add('fade-in');
        }

        function retryWrong() {
            if (wrongQuestions.length === 0) {
                return;
            }

            startRound(wrongQuestions.slice());
        }

        function restartQuiz() {
            if (allQuestions.length === 0) {
                showEmptyState();
                return;
            }

            startRound(allQuestions);
        }

        function showEmptyState() {
            progressBar.style.display = 'none';
            quizArea.style.display = 'none';
            mainButtons.style.display = 'none';
            completionMessage.style.display = 'block';
            completionHeading.style.color = '#1f3a5f';
            completionHeading.textContent = 'Ei kysymyksiä';
            completionText.textContent = 'Lisää kysymyksiä JSON-tiedostoon.';
            retryWrongBtn.style.display = 'none';
            restartBtn.style.display = 'none';
        }

        document.addEventListener('keydown', function (event) {
            const key = event.key.toLowerCase();

            if (completionMessage.style.display === 'block') {
                if (allQuestions.length === 0) {
                    return;
                }

                if (key === 'v' && retryWrongBtn.style.display !== 'none') {
                    event.preventDefault();
                    retryWrong();
                } else if (key === 'r') {
                    event.preventDefault();
                    restartQuiz();
                }
                return;
            }

            if (isAnswered) {
                if (event.key === 'Enter' || key === 'n') {
                    event.preventDefault();
                    nextQuestion();
                }
                return;
            }

            if (event.key === 'Enter') {
                return;
            }

            const number = Number(event.key);
            if (Number.isInteger(number) && number >= 1 && number <= 9) {
                const index = number - 1;
                if (currentQuestion && index < currentQuestion.options.length) {
                    event.preventDefault();
                    selectOption(index);
                }
            }
        });

        if (allQuestions.length === 0) {
            showEmptyState();
        } else {
            startRound(allQuestions);
        }
    </script>
